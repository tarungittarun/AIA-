name: Rebuild calculator-only APK QA report

on:
  # The direct APK QA workflow publishes its own report. This workflow is a
  # manual fallback for rebuilding from a specific earlier run.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID that produced the three direct APK evidence shards
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-report:
    name: Build and publish the calculator-only PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the session branch
        uses: actions/checkout@v4

      - name: Confirm publication stays on the session branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "arena/e4dfeee3-aia" ]]; then
            echo "Refusing to publish on unexpected branch: $GITHUB_REF_NAME" >&2
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF generator
        run: python -m pip install --disable-pip-version-check 'reportlab>=4,<5' 'pypdf>=5,<7'

      - name: Resolve and validate the direct APK evidence run
        id: source
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const requested = process.env.REQUESTED_RUN_ID;
            let sourceRunId;
            if (requested) {
              sourceRunId = Number(requested);
              if (!Number.isSafeInteger(sourceRunId) || sourceRunId <= 0) {
                throw new Error(`Invalid source run ID: ${requested}`);
              }
            } else {
              const { data: workflowList } = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const qaWorkflow = workflowList.workflows.find(workflow =>
                workflow.path.endsWith('/myspace-user-apk-e2e.yml') && workflow.state === 'active'
              );
              if (!qaWorkflow) throw new Error('Could not find the active direct APK QA workflow');
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: qaWorkflow.id,
                branch: 'arena/e4dfeee3-aia',
                status: 'completed',
                per_page: 50,
              });
              for (const run of runs.workflow_runs) {
                const { data: artifactList } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const shardCount = artifactList.artifacts.filter(artifact =>
                  !artifact.expired && /^myspace-user-v3\.12\.35-shard-[1-3]-\d+$/.test(artifact.name)
                ).length;
                if (shardCount === 3) {
                  sourceRunId = run.id;
                  core.info(`Selected completed direct APK run ${run.id} (${run.conclusion}) at ${run.head_sha}`);
                  break;
                }
              }
              if (!sourceRunId) throw new Error('No completed direct APK run with all three evidence shards was found');
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: sourceRunId,
              per_page: 100,
            });
            const shardCount = artifacts.artifacts.filter(artifact =>
              !artifact.expired && /^myspace-user-v3\.12\.35-shard-[1-3]-\d+$/.test(artifact.name)
            ).length;
            if (shardCount !== 3) {
              throw new Error(`Source run ${sourceRunId} has ${shardCount}/3 required direct APK evidence shards`);
            }
            core.setOutput('run_id', String(sourceRunId));
            core.info(`Using source run ${sourceRunId} with all three direct APK evidence shards`);

      - name: Download the three direct APK evidence shards
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: myspace-user-v3.12.35-shard-*
          merge-multiple: false
          path: reports/evidence/incoming-calculator-v3.12.35

      - name: Build the PDF and preserve original evidence
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 qa/build_myspace_user_pdf.py \
            --artifact-root reports/evidence/incoming-calculator-v3.12.35 \
            --output reports/myspace-calculator-qa-v3.12.35-72.pdf \
            --evidence-output reports/evidence/calculator-focused-v3.12.35-72 \
            --source-run-id "$SOURCE_RUN_ID"
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          path = Path('reports/myspace-calculator-qa-v3.12.35-72.pdf')
          data = path.read_bytes()
          assert data.startswith(b'%PDF-'), 'missing PDF signature'
          reader = PdfReader(str(path))
          assert len(reader.pages) >= 8, f'unexpectedly short calculator report: {len(reader.pages)} pages'
          embedded = sum(len(page.images) for page in reader.pages)
          assert embedded >= 5, f'expected original calculator screenshots to be embedded, found {embedded}'
          print(f'Calculator PDF verified: {len(reader.pages)} pages, {embedded} embedded screenshots, {len(data):,} bytes')
          PY

      - name: Publish PDF and proof bundle on the session branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/myspace-calculator-qa-v3.12.35-72.pdf reports/evidence/calculator-focused-v3.12.35-72/
          if git diff --cached --quiet; then
            echo "No calculator PDF or evidence updates to publish."
          else
            git commit -m "Publish calculator-focused MySpace and MyCalc QA report"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
