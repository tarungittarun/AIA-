name: Android CI
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build flavors and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Gradle workspace
        run: gradle help
      - name: Run JVM tests
        run: gradle testFullDebugUnitTest
      - name: Assemble both debug variants
        run: gradle assembleFullDebug assembleMycalcDebug
      - name: Verify no network permission is declared
        run: '! grep -R "android.permission.INTERNET" app/src --include="AndroidManifest.xml"'
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myspace-one-debug-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
