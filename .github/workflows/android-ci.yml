name: Android CI
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build flavors and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Validate Gradle workspace
        shell: bash
        run: |
          set +e
          gradle help --stacktrace --console=plain > gradle-help.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            grep -A12 -B2 -E 'What went wrong|FAILURE:|Could not resolve|Script compilation error' gradle-help.log | head -n 18 | tr '\n' ' ' | cut -c1-8000 | while IFS= read -r line; do echo "::error title=Gradle help failed::$line"; done
            exit "$result"
          fi
          cat gradle-help.log
      - name: Run JVM tests
        run: gradle testFullDebugUnitTest
      - name: Assemble both debug variants
        run: gradle assembleFullDebug assembleMycalcDebug
      - name: Verify no network permission is declared
        run: '! grep -R "android.permission.INTERNET" app/src --include="AndroidManifest.xml"'
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myspace-one-debug-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
