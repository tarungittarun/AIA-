name: Android CI
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build flavors and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Gradle workspace
        run: bash .github/scripts/gradle-ci.sh help help
      - name: Run JVM tests
        run: bash .github/scripts/gradle-ci.sh tests testFullDebugUnitTest
      - name: Assemble both debug variants
        run: bash .github/scripts/gradle-ci.sh assemble assembleFullDebug assembleMycalcDebug
      - name: Audit privacy-sensitive APK permissions
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          MYCALC="app/build/outputs/apk/mycalc/debug/app-mycalc-debug.apk"
          FULL="app/build/outputs/apk/full/debug/app-full-debug.apk"
          "$AAPT" dump permissions "$MYCALC" | tee mycalc-permissions.txt
          if grep -q 'uses-permission' mycalc-permissions.txt; then echo 'MyCalc must have zero permissions'; exit 1; fi
          "$AAPT" dump permissions "$FULL" | tee full-permissions.txt
          if grep -q 'android.permission.INTERNET' full-permissions.txt; then echo 'Internet permission is forbidden'; exit 1; fi
          grep -q 'android.permission.RECORD_AUDIO' full-permissions.txt
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myspace-one-debug-apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
