name: Calculator APK v3.12.18 (55) E2E QA

on:
  push:
    branches: [arena/e4dfeee3-aia]
    paths:
      - .github/workflows/calculator-apk-e2e.yml
      - qa/calculator_e2e.py
      - qa/test_calculator_e2e.py
      - qa/run_emulator_e2e.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-apk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-e2e:
    name: ${{ matrix.case }} on Android 14 ATD (Google APIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        case:
          - TC-CALC-001
          - TC-CALC-002
          - TC-CALC-003
          - TC-CALC-004
          - TC-CALC-005
          - TC-CALC-006
          - TC-CALC-007
          - TC-CALC-008
          - TC-CALC-009
          - TC-CALC-010
    steps:
      - name: Check out the QA harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit-test the calculator QA harness
        run: python3 -m unittest discover -s qa -p 'test_*.py'

      - name: Install screenshot OCR fallback
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            if ! sudo apt-get update -qq || ! sudo apt-get install --no-install-recommends -y tesseract-ocr; then
              echo "::warning::Tesseract could not be installed; the compressed UIAutomator path will still run."
            fi
          fi
          if command -v tesseract >/dev/null 2>&1; then
            tesseract --version | head -n 1
          else
            echo "::warning::Screenshot OCR fallback unavailable because Tesseract is missing."
          fi

      - name: Check out exact source commit containing APK v3.12.18-55
        uses: actions/checkout@v4
        with:
          repository: tarungittarun/TicTic
          ref: ca8ab165ef155a367b9959a3c9cd7f4be21f891a
          path: linked-source
          sparse-checkout: artifacts/MySpace-v3.12.18-55-lite-dist.apk
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify exact supplied APK v3.12.18-55
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/linked-source/artifacts/MySpace-v3.12.18-55-lite-dist.apk"
          python3 - "$apk" <<'PY'
          import hashlib, sys, zipfile
          apk = sys.argv[1]
          expected = 'cd56a2b654dbe7d3a54c4dd291a06e2ec9d7150b6c399a89f93591b167d6e4e8'
          with open(apk, 'rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')
          with zipfile.ZipFile(apk) as archive:
              bad_member = archive.testzip()
          if bad_member:
              raise SystemExit(f'APK ZIP integrity error at {bad_member}')
          print(f'Verified APK SHA-256: {actual}')
          PY
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified APK SHA-256: cd56a2b654dbe7d3a54c4dd291a06e2ec9d7150b6c399a89f93591b167d6e4e8"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Boot Android 14 emulator and run ${{ matrix.case }}
        shell: bash
        env:
          CALCULATOR_CASES: ${{ matrix.case }}
        run: bash qa/run_emulator_e2e.sh

      - name: Upload ${{ matrix.case }} report, screenshots, and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-e2e-v3.12.18-${{ matrix.case }}-${{ github.run_number }}
          path: reports/e2e/
          if-no-files-found: warn
          retention-days: 30
