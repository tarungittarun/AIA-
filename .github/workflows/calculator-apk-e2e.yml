name: Calculator APK E2E QA

on:
  push:
    branches: [arena/e4dfeee3-aia]
    paths:
      - .github/workflows/calculator-apk-e2e.yml
      - qa/calculator_e2e.py
      - reports/calculator-defect-tracker.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-apk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-e2e:
    name: MySpace Calculator on Android 11 emulator (Google APIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the QA harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out the exact source commit containing the supplied APK
        uses: actions/checkout@v4
        with:
          repository: tarungittarun/TicTic
          ref: 76f03909ea8bd11c9c4fed83c8e3d7279e3fc9c9
          path: linked-source
          sparse-checkout: artifacts/MySpace-v3.12.7-44-lite-dist.apk
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the exact supplied APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/linked-source/artifacts/MySpace-v3.12.7-44-lite-dist.apk"
          python3 - "$apk" <<'PY'
          import hashlib, sys, zipfile
          apk = sys.argv[1]
          expected = 'ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23'
          with open(apk, 'rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')
          with zipfile.ZipFile(apk) as archive:
              bad_member = archive.testzip()
          if bad_member:
              raise SystemExit(f'APK ZIP integrity error at {bad_member}')
          print(f'Verified APK SHA-256: {actual}')
          PY
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified APK SHA-256: ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23"

      - name: Run calculator UI tests in an isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            mkdir -p reports/e2e
            python3 -u qa/calculator_e2e.py \
              --apk "$APK_PATH" \
              --package app.space.one \
              --report-dir reports/e2e

      - name: Upload test report, screenshots, and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-e2e-evidence-${{ github.run_number }}
          path: reports/e2e/
          if-no-files-found: warn
          retention-days: 30
