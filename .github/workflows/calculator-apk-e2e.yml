name: Calculator APK E2E QA

on:
  push:
    branches: [arena/e4dfeee3-aia]
    paths:
      - .github/workflows/calculator-apk-e2e.yml
      - qa/calculator_e2e.py
      - qa/run_emulator_e2e.sh
      - reports/calculator-defect-tracker.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-apk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-e2e:
    name: MySpace Calculator on Android 14 ATD emulator (Google APIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the QA harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install screenshot OCR fallback
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            if ! sudo apt-get update -qq || ! sudo apt-get install --no-install-recommends -y tesseract-ocr; then
              echo "::warning::Tesseract could not be installed; the compressed UIAutomator path will still run."
            fi
          fi
          if command -v tesseract >/dev/null 2>&1; then
            tesseract --version | head -n 1
          else
            echo "::warning::Screenshot OCR fallback unavailable because Tesseract is missing."
          fi

      - name: Check out the exact source commit containing the supplied APK
        uses: actions/checkout@v4
        with:
          repository: tarungittarun/TicTic
          ref: 76f03909ea8bd11c9c4fed83c8e3d7279e3fc9c9
          path: linked-source
          sparse-checkout: artifacts/MySpace-v3.12.7-44-lite-dist.apk
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the exact supplied APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/linked-source/artifacts/MySpace-v3.12.7-44-lite-dist.apk"
          python3 - "$apk" <<'PY'
          import hashlib, sys, zipfile
          apk = sys.argv[1]
          expected = 'ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23'
          with open(apk, 'rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')
          with zipfile.ZipFile(apk) as archive:
              bad_member = archive.testzip()
          if bad_member:
              raise SystemExit(f'APK ZIP integrity error at {bad_member}')
          print(f'Verified APK SHA-256: {actual}')
          PY
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified APK SHA-256: ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Boot Android 14 emulator and run calculator UI tests
        shell: bash
        run: bash qa/run_emulator_e2e.sh

      - name: Upload test report, screenshots, and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-e2e-evidence-${{ github.run_number }}
          path: reports/e2e/
          if-no-files-found: warn
          retention-days: 30
