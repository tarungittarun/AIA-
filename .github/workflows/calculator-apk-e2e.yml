name: MySpace v3.12.24-61 Test Guide E2E QA

on:
  push:
    branches: [arena/e4dfeee3-aia]
    paths:
      - .github/workflows/calculator-apk-e2e.yml
      - qa/calculator_e2e.py
      - qa/test_calculator_e2e.py
      - qa/run_prebooted_emulator_e2e.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myspace-guide-apk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-guide-e2e:
    name: Guide shard ${{ matrix.shard }} — ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: 1
            title: Arithmetic and core input
            cases: TC-CALC-001,TC-CALC-002,TC-CALC-003,TC-CALC-004
            standalone_cases: TC-CALC-001,TC-CALC-002,TC-CALC-003,TC-CALC-004,TC-CALC-012
          - shard: 2
            title: Scientific, history, and replay
            cases: TC-CALC-005,TC-CALC-006,TC-CALC-007,TC-CALC-011
            standalone_cases: TC-CALC-005,TC-CALC-006,TC-CALC-007,TC-CALC-011
          - shard: 3
            title: Precision, limits, and reference probe
            cases: TC-CALC-008,TC-CALC-009,TC-CALC-010
            standalone_cases: TC-CALC-008,TC-CALC-009

    steps:
      - name: Check out the QA harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit-test the calculator QA harness
        run: python3 -m unittest discover -s qa -p 'test_*.py'

      - name: Install screenshot OCR fallback
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            if ! sudo apt-get update -qq || ! sudo apt-get install --no-install-recommends -y tesseract-ocr; then
              echo "::warning::Tesseract could not be installed; the compressed UIAutomator path will still run."
            fi
          fi
          if command -v tesseract >/dev/null 2>&1; then
            tesseract --version | head -n 1
          else
            echo "::warning::Screenshot OCR fallback unavailable because Tesseract is missing."
          fi

      - name: Check out pinned source, guide, and both APKs
        uses: actions/checkout@v4
        with:
          repository: tarungittarun/TicTic
          ref: 4f47a46d18a172b7ea44e8f180e5a6035a1cc54d
          path: linked-source
          sparse-checkout: |
            TEST-GUIDE.md
            artifacts/MySpace-v3.12.24-61-lite-dist.apk
            artifacts/MyCalc-v1.0.22-23.apk
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify pinned guide and APK identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/linked-source" <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          root = pathlib.Path(sys.argv[1])
          expected = {
              'TEST-GUIDE.md': '92bc29905038b13468e52432b4531353cac368acc1f72e0ef8f3a8c5092bfe14',
              'artifacts/MySpace-v3.12.24-61-lite-dist.apk': 'bd6f3850b659ee8c9c37c17055e9d688caa7ca5c298a28487c475ae0c948e986',
              'artifacts/MyCalc-v1.0.22-23.apk': '4465b0f0d7ff4c3e4fbdb9a9a09db88b0e4fffcbb02ce4f3e27d73a0b12510fa',
          }
          for relative, expected_sha256 in expected.items():
              path = root / relative
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected_sha256:
                  raise SystemExit(f'{relative} SHA-256 mismatch: expected {expected_sha256}, got {actual}')
              if path.suffix == '.apk':
                  with zipfile.ZipFile(path) as archive:
                      bad_member = archive.testzip()
                  if bad_member:
                      raise SystemExit(f'{relative} ZIP integrity error at {bad_member}')
              print(f'Verified {relative}: SHA-256 {actual}')
          PY
          echo "APK_PATH=$GITHUB_WORKSPACE/linked-source/artifacts/MySpace-v3.12.24-61-lite-dist.apk" >> "$GITHUB_ENV"
          echo "EXTRA_APK_PATH=$GITHUB_WORKSPACE/linked-source/artifacts/MyCalc-v1.0.22-23.apk" >> "$GITHUB_ENV"
          {
            echo '### Pinned inputs verified'
            echo '- Guide: `TEST-GUIDE.md` (source commit `4f47a46d18a172b7ea44e8f180e5a6035a1cc54d`)'
            echo '- MySpace: `3.12.24` / code `61` / package `app.space.one`'
            echo '- Standalone MyCalc: `1.0.22` / code `23` / package `app.space.calc`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 14 and run guide shard ${{ matrix.shard }}
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          SHARD: ${{ matrix.shard }}
          CALCULATOR_CASES: ${{ matrix.cases }}
          EXTRA_CALCULATOR_CASES: ${{ matrix.standalone_cases }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash qa/run_prebooted_emulator_e2e.sh

      - name: Upload shard ${{ matrix.shard }} evidence and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myspace-guide-v3.12.24-shard-${{ matrix.shard }}-${{ github.run_number }}
          path: reports/e2e/guide-shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 60
