name: Calculator APK E2E QA

on:
  push:
    branches: [arena/e4dfeee3-aia]
    paths:
      - .github/workflows/calculator-apk-e2e.yml
      - qa/calculator_e2e.py
      - reports/calculator-defect-tracker.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-apk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-e2e:
    name: MySpace Calculator on Android 14 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the QA harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify the exact APK supplied for this test
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/MySpace-v3.12.7-44-lite-dist.apk"
          curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github.raw' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/tarungittarun/TicTic/git/blobs/944ac047b622521a6d751db673bcd8cf74c6965f' \
            --output "$apk"
          echo 'ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23  '"$apk" | sha256sum --check
          unzip -t "$apk" >/dev/null
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified APK SHA-256: ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23"

      - name: Run calculator UI tests in an isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          script: |
            mkdir -p reports/e2e
            python3 -u qa/calculator_e2e.py \
              --apk "$APK_PATH" \
              --package app.space.one \
              --report-dir reports/e2e

      - name: Upload test report, screenshots, and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-e2e-evidence-${{ github.run_number }}
          path: reports/e2e/
          if-no-files-found: warn
          retention-days: 30
