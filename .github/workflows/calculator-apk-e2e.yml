name: Calculator APK E2E QA

on:
  push:
    branches: [arena/e4dfeee3-aia]
    paths:
      - .github/workflows/calculator-apk-e2e.yml
      - qa/calculator_e2e.py
      - reports/calculator-defect-tracker.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-apk-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-e2e:
    name: MySpace Calculator on Android 11 emulator (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the QA harness
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify the exact APK supplied for this test
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/MySpace-v3.12.7-44-lite-dist.apk"
          curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github.raw' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/tarungittarun/TicTic/git/blobs/944ac047b622521a6d751db673bcd8cf74c6965f' \
            --output "$apk"
          python3 - "$apk" <<'PY'
          import hashlib, sys, zipfile
          apk = sys.argv[1]
          expected = 'ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23'
          with open(apk, 'rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')
          with zipfile.ZipFile(apk) as archive:
              bad_member = archive.testzip()
          if bad_member:
              raise SystemExit(f'APK ZIP integrity error at {bad_member}')
          print(f'Verified APK SHA-256: {actual}')
          PY
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified APK SHA-256: ff52331518b71a153abf6ef76c964538044121230e1ae87d2855e535a94e0a23"

      - name: Run calculator UI tests in an isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: arm64-v8a
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            mkdir -p reports/e2e
            python3 -u qa/calculator_e2e.py \
              --apk "$APK_PATH" \
              --package app.space.one \
              --report-dir reports/e2e

      - name: Upload test report, screenshots, and UI dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-e2e-evidence-${{ github.run_number }}
          path: reports/e2e/
          if-no-files-found: warn
          retention-days: 30
